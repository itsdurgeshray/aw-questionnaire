<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endocrine Health Assessment | Autonomic Wellness</title>
<meta name="description" content="A doctor-reviewed online health assessment in nine sections.">
<link rel="icon" href="assets/logo.png">
<style>
@font-face{font-family:aeonik;src:url(assets/Aeonik-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:aeonik;src:url(assets/Aeonik-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:aeonik;src:url(assets/Aeonik-Bold.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --aw-ink-950:#020a1d;--aw-ink-800:#1b294b;--aw-ink-700:#243763;--aw-ink-600:#2c4278;
  --aw-slate-600:#59647d;--aw-slate-500:#7c8394;
  --aw-blue-700:#163f9d;--aw-blue-300:#8098d1;--aw-blue-150:#bfd2fe;--aw-blue-25:#eff4ff;
  --aw-green-600:#169d69;--aw-green-200:#8fefca;--aw-green-50:#edfcf7;
  --aw-amber-500:#fa0;--aw-amber-50:#fffbef;
  --line:#e4e8f0;--mute:#687083;--q:#243763;--green:#169d69;--mint:#edfcf7;
  --acc:#8098d1;--acc-l:#e9eefc;--acc-d:#47599c;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --gradient-cta:linear-gradient(180deg,rgba(151,170,217,.24) 0%,rgba(44,66,120,.24) 100%),#2c4278;
  --ease:cubic-bezier(.21,.47,.32,.98);--spring:cubic-bezier(.34,1.56,.64,1);
  --hdr-h:150px;--bar-h:88px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
html{-webkit-text-size-adjust:100%}
body{font-family:aeonik,"Helvetica Neue",Arial,sans-serif;background:#f6f7fa;color:var(--q);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
button,textarea{font:inherit;color:inherit;background:none}
button{cursor:pointer}button:disabled{cursor:default}
i,em{font-style:normal}
svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid rgba(128,152,209,.45);outline-offset:2px}
#app{position:relative}

/* ===== Section scenes: soft game worlds behind the questionnaire ===== */
.worlds{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#f6f7fa}
.world{position:absolute;inset:0;opacity:0;transition:opacity 1.4s linear}
.world.on{opacity:1}
.world .ph{position:absolute;inset:-3%;background-size:cover;background-position:50% 100%;animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-1%,-.6%,0) scale(1.035)}}
.world .veil{position:absolute;inset:0;background:radial-gradient(ellipse 44% 56% at 50% 44%,rgba(248,249,251,.6) 0,rgba(248,249,251,.3) 55%,rgba(248,249,251,0) 100%),linear-gradient(90deg,rgba(248,249,251,0) 0,rgba(248,249,251,.5) 24%,rgba(248,249,251,.5) 76%,rgba(248,249,251,0) 100%),linear-gradient(180deg,rgba(248,249,251,.4) 0,rgba(248,249,251,0) 60%)}
.motes{position:absolute;inset:0;overflow:hidden}
.motes i{position:absolute;bottom:-12px;width:var(--z);height:var(--z);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;animation:mote var(--d) linear var(--dl) infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}80%{opacity:.6}100%{transform:translate(var(--dx),-72vh);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Buttons ===== */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;min-width:190px;padding:0 28px;border-radius:8px;background:var(--gradient-cta);border:1.5px solid #243763;color:#fff;font-size:16px;font-weight:500;box-shadow:var(--shadow-sm);transition:transform .25s,opacity .25s;white-space:nowrap}
.cta:hover{transform:scale(1.02)}.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;pointer-events:none}
.cta svg.i{width:18px;height:18px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--aw-ink-950);font-size:16px;font-weight:500;box-shadow:var(--shadow-sm);transition:background .2s}
.ghost:hover{background:var(--aw-blue-25)}
.ghost svg.i{width:18px;height:18px}
.save{font-size:16px;color:var(--mute);text-decoration:underline;text-underline-offset:5px;text-decoration-color:#c5cad6;transition:color .2s;white-space:nowrap}
.save:hover{color:var(--q)}

/* ===== Header (persistent) ===== */
.top{position:sticky;top:0;z-index:50}
.top::before{content:"";position:absolute;inset:0 0 -48px;z-index:-1;pointer-events:none;background:rgba(250,251,252,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 64px),transparent 100%)}
.top .in{max-width:1164px;margin:0 auto;padding:22px 24px 18px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.ttl{min-width:0}
.ttl h1{font-size:24px;line-height:32px;font-weight:500;color:var(--aw-ink-950);letter-spacing:-.01em}
.ttl p{margin-top:2px;font-size:14px;line-height:20px;letter-spacing:.02em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.pills{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:100px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:background .6s,border-color .6s,color .6s}
.pill.sec{background:var(--acc-l);border-color:var(--acc);color:var(--acc-d)}
.pill.time{border-color:var(--aw-blue-150);color:#5a6fae}
.pill.bdg{color:var(--q)}
.pill.bdg svg.i{width:16px;height:16px;color:var(--acc-d)}
.pill.bdg:hover{background:var(--aw-blue-25)}
.pill.xp{gap:8px;border-color:#ffd88a;background:var(--aw-amber-50);color:#8a5a00;font-variant-numeric:tabular-nums}
.pill.leaf{gap:6px;border-color:#b5d98a;background:#f5fbec;color:#3d7419;font-variant-numeric:tabular-nums}
.pill.leaf b{font-weight:700}
.lf-i{display:inline-block;width:16px;height:16px;flex-shrink:0}
.lf-i svg{width:100%;height:100%;display:block}
.pill.leaf.hit .lf-i{animation:wig .5s var(--spring)}
@keyframes wig{30%{transform:rotate(-18deg) scale(1.2)}70%{transform:rotate(10deg)}}
.pill.xp b{font-weight:700}
.coin-i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffc33d 55%,#e08e00);box-shadow:inset 0 -1px 0 rgba(0,0,0,.14);transition:box-shadow .3s}
.pill.hit{animation:hit .42s var(--spring)}
.pill.xp.hit .coin-i{box-shadow:0 0 0 4px rgba(255,190,60,.28),0 0 14px 4px rgba(255,190,60,.65)}
@keyframes hit{40%{transform:scale(1.1)}}
.pct{font-size:12px;line-height:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.pct b{font-weight:400}

.segs{display:flex;gap:8px;margin-top:32px}
.sg{flex:1;min-width:0}
.tr{position:relative;display:block;height:6px;border-radius:6px;background:#eceff4}
.tr>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--green);transition:width .6s var(--ease)}
.cr{position:absolute;top:-33px;width:40px;height:40px;transform:translateX(-50%) scale(var(--g,1));transform-origin:50% 85%;transition:left .6s var(--ease),transform .6s var(--ease)}
.cr svg{width:100%;height:100%;display:block}
.cr.up{left:50%;filter:grayscale(1) brightness(1.15);opacity:.45}
.cr.ride{z-index:2;filter:drop-shadow(0 2px 3px rgba(27,41,75,.18))}
.cr.ride.hop{animation:hop .5s var(--spring)}
@keyframes hop{40%{transform:translate(-50%,-7px) scale(var(--g,1))}}
.cr.ride.eat{animation:eat .5s var(--spring)}
@keyframes eat{30%{transform:translateX(-50%) scale(calc(var(--g,1) * 1.28))}65%{transform:translateX(-50%) scale(calc(var(--g,1) * .94))}}
.leafp{position:fixed;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;z-index:70;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(40,90,30,.25))}
.leafp svg{width:100%;height:100%;display:block}
.nm{display:block;margin-top:10px;text-align:center;font-size:14px;line-height:20px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.cur .nm{color:var(--q);font-weight:500}
.cap{display:none}

/* ===== Layer 2: the question ===== */
.stage{min-height:calc(100vh - var(--hdr-h));min-height:calc(100dvh - var(--hdr-h));display:flex;flex-direction:column;align-items:center;padding:64px 24px calc(var(--bar-h) + env(safe-area-inset-bottom) + 24px)}
.stage.center{justify-content:center;padding-top:40px;padding-bottom:40px}
.qz,.cue{transition:opacity .6s var(--ease),transform .6s var(--ease)}
.qz{width:100%;display:flex;flex-direction:column;align-items:center}
.qz.rise{animation:rise2 .6s var(--ease) both}
@keyframes rise2{from{opacity:0;transform:translateY(16px)}}
body.soft .qz,body.soft .cue{opacity:0;transform:translateY(24px);pointer-events:none}
.eyeg{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;line-height:20px;color:var(--mute)}
.dots{display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.dots i{width:4px;height:4px;border-radius:1px;background:var(--green)}
.dots i:nth-child(3n+2){background:var(--aw-green-200)}.dots i:nth-child(4n){background:#45c08e}
.qrow{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:24px;width:100%;max-width:828px;margin-top:16px}
.qtitle{font-size:32px;line-height:40px;font-weight:400;color:var(--q);text-align:center;letter-spacing:-.01em;text-wrap:balance}
.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(27,41,75,.07);display:grid;place-items:center;color:var(--q);transition:border-color .2s,opacity .2s,transform .2s}
.arrow:hover{border-color:var(--aw-blue-300)}
.arrow:disabled{opacity:.35}
.qhelp{max-width:576px;margin-top:10px;text-align:center;font-size:16px;line-height:24px;color:var(--mute)}
.term{color:var(--aw-blue-700);text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:5px;border-radius:4px;font:inherit}
.term[aria-expanded="true"]{background:var(--aw-blue-25);text-decoration-style:solid}

.opts{width:100%;max-width:576px;display:flex;flex-direction:column;gap:12px;margin-top:48px}
.opt{position:relative;display:flex;align-items:center;gap:16px;min-height:56px;padding:14px 20px;background:#fff;border:1px solid #edf0f5;border-radius:6px;text-align:left;font-size:18px;line-height:24px;color:var(--q);box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .2s,background .2s,transform .2s}
.opt:hover{border-color:#c9d2e3}
.opt:active{transform:scale(.995)}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #d3d9e5;flex-shrink:0;display:grid;place-items:center;transition:.2s}
.rd svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.multi .rd{border-radius:5px}
.opt[aria-checked="true"]{background:var(--mint);border-color:var(--green);box-shadow:inset 0 0 0 .5px var(--green)}
.opt[aria-checked="true"] .rd{background:var(--green);border-color:var(--green)}
.opt[aria-checked="true"] .rd svg{opacity:1}
.opt .tx{display:flex;flex-direction:column}
.opt .s{display:none;font-size:14px;line-height:20px;color:var(--mute)}

.ta{width:100%;max-width:576px;min-height:160px;margin-top:48px;padding:16px;border:1px solid #e3e7ef;border-radius:8px;background:#fff;font-size:18px;line-height:28px;color:var(--q);resize:vertical}

/* A few quick ones: short questions as tidy cards on one screen */
.qk{width:100%;max-width:828px;margin-top:32px;display:flex;flex-direction:column;gap:12px}
.qk-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.qk-bar p{font-size:16px;line-height:24px;color:var(--mute)}
.qk-none{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.85);border:1px solid #e3e7ef;font-size:14px;font-weight:500;color:var(--q);white-space:nowrap;flex-shrink:0;transition:background .2s,border-color .2s}
.qk-none svg.i{width:16px;height:16px}
.qk-none:hover{border-color:#c9d2e3}
.qk-none[aria-pressed="true"]{background:var(--mint);border-color:var(--green);color:#0d6e49}
.qk-q{padding:18px 20px 20px;background:rgba(255,255,255,.92);border:1px solid #edf0f5;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .25s;scroll-margin-top:calc(var(--hdr-h) + 24px)}
.qk-q.ok{border-color:#cdeedd}
.qk-t{display:flex;align-items:center;gap:12px;font-size:18px;line-height:26px;color:var(--q)}
.qk-t .n{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f1f4f9;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.qk-t .n svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.qk-q.ok .qk-t .n{background:var(--green);color:#fff}
.opts.row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;max-width:none;margin-top:14px;padding-left:40px}
.opts.row .opt{min-height:48px;gap:10px;padding:10px 14px;font-size:16px;line-height:22px;border-color:#e6eaf1;box-shadow:none}
.opts.row .rd{width:18px;height:18px}

/* Cue card */
.cue{width:100%;max-width:576px;margin:20px auto 0}
.cue.wide{max-width:828px}
.cuec{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;background:rgba(255,255,255,.97);border:1px solid #e6eaf1;border-radius:8px}
.cuec svg.i{width:20px;height:20px;margin-top:1px;color:var(--q)}
.cuec b{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--aw-ink-950)}
.cuec p{margin-top:2px;font-size:14px;line-height:20px;color:var(--mute)}
.cuec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin-top:6px;font-size:14px;line-height:20px}
.cuec dt{color:var(--q);font-weight:500}.cuec dd{color:var(--mute)}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.bar::before{content:"";position:absolute;inset:-48px 0 0;z-index:-1;pointer-events:none;background:rgba(250,251,252,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 64px),transparent 100%)}
.bin{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 56px}
.bl{display:flex;align-items:center;gap:20px}
.tools{display:flex;gap:4px;padding-left:16px;border-left:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--mute);transition:.2s}
.ib:hover{color:var(--q);background:#f3f5f9}
.ib[aria-pressed="true"]{color:var(--q)}
.bc{display:flex;gap:32px}
.tl{display:inline-flex;align-items:center;gap:10px;font-size:16px;color:var(--q);transition:color .2s;white-space:nowrap}
.tl:hover{opacity:.75}
.tl svg.i{width:22px;height:22px}
.br{display:flex;justify-content:flex-end}

/* Leaf flight */
.coin{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6cf,#ffc53d 55%,#e89400);box-shadow:0 0 10px 2px rgba(255,190,60,.6);z-index:70;pointer-events:none}
.xpf{position:fixed;z-index:70;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:100px;background:#f5fbec;border:1px solid #b5d98a;color:#3d7419;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px -8px rgba(168,106,0,.4);animation:xpf .95s var(--ease) forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}18%{opacity:1;transform:translate(-50%,-90%) scale(1)}65%{opacity:1;transform:translate(-50%,-120%)}100%{opacity:0;transform:translate(-50%,-150%) scale(.92)}}
.flybadge{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:70;pointer-events:none}
.flybadge svg{width:100%;height:100%}
.toast{position:fixed;left:50%;top:calc(var(--hdr-h) + 16px);z-index:55;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:100px;background:#fff;border:1px solid #b5d98a;box-shadow:0 12px 30px -12px rgba(27,41,75,.28);font-size:16px;font-weight:500;color:var(--q);white-space:nowrap;opacity:0;visibility:hidden;transform:translate(-50%,-12px);transition:.35s var(--ease)}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast b{color:#3d7419}
.toast .lf-i{width:20px;height:20px}

/* ===== Section complete: the new life stage and a discovery on one screen ===== */
.reward{position:fixed;inset:0;z-index:46;overflow-y:auto;display:flex;padding:calc(var(--hdr-h) + 24px) 16px 96px;background:radial-gradient(ellipse 60% 70% at 50% 45%,rgba(255,255,255,.72),rgba(255,255,255,.26) 76%);opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
.reward.open{opacity:1;visibility:visible}
.bar{transition:opacity .4s var(--ease)}
body.soft .bar{opacity:0;pointer-events:none}
.rw{width:100%;max-width:640px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.st{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.p1 .s1,.p2 .s2,.p3 .s3{opacity:1;transform:none}
.bwrap{position:relative;width:168px;height:168px;margin:0 0 18px;perspective:900px}
.bwrap>span{position:absolute;inset:0;display:block}
.bwrap .halo{inset:-70px;border-radius:50%;background:radial-gradient(circle,var(--acc-l) 0,transparent 66%);opacity:0;transform:scale(.6);transition:1s var(--ease)}
.p1 .halo{opacity:1;transform:none}
.bwrap .rays{inset:-90px;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 9deg,color-mix(in srgb,var(--acc) 24%,transparent) 9deg 13deg,transparent 13deg 24deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);opacity:0;transition:opacity 1.2s;animation:spin 40s linear infinite}
.p2 .rays{opacity:1}
.flipped .rays{opacity:.25}
.bsil{opacity:0;transform:scale(.5);transition:opacity .6s var(--ease),transform .9s var(--spring)}
.bsil svg{width:100%;height:100%;filter:drop-shadow(0 0 16px var(--acc)) drop-shadow(0 0 4px #fff)}
.p1 .bsil{opacity:1;transform:none;animation:pulse 1.2s ease-in-out infinite}
.p2 .bsil{opacity:0;animation:none;transition-duration:.3s}
.fwrap{opacity:0}
.p2 .fwrap{animation:unlock 1.1s var(--ease) forwards}
@keyframes unlock{0%{opacity:0;transform:scale(.35) rotateY(-260deg)}55%{opacity:1;transform:scale(1.14) rotateY(18deg)}78%{transform:scale(.97) rotateY(-6deg)}100%{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05)}}
.flip{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.65,0,.35,1)}
.flip .face{position:absolute;inset:0;display:block;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .face svg{width:100%;height:100%;filter:drop-shadow(0 16px 20px rgba(27,41,75,.2))}
.stg,.sbadge{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.sbadge{filter:drop-shadow(0 16px 22px rgba(27,41,75,.22))}

const FACT_BY_ID = {}; Object.entries(FACTS).forEach(([sid,l]) => l.forEach(f => FACT_BY_ID[f.id] = {...f, sid}));
function pickFact(si) {
  const lib = FACTS[SEC[si].id], seen = new Set(S.facts.map(f=>f.id));

  const pers = lib.find(f => f.when && !seen.has(f.id) && ok(f));

}

/* ---------- State ---------- */
const KEY = 'aw-assessment';

if (S.pending != null) { if (S.pending < SEC.length-1) { S.idx = SEC[S.pending].end+1; S.furthest = Math.max(S.furthest, S.idx); } S.pending = null; }
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ui = {cue:null, drawer:false, tab:'stages', openSec:null, lastIdx:null, shownXp:S.xp, jump:false, jsec:0};

const wait = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 120) : ms));
const fmt = n => n.toLocaleString('en-GB');
const pad = n => String(n).padStart(2,'0');

const unitsDone = q => { const v = S.answers[q.i]; if (v===undefined||v===null) return 0;
  if (q.k==='quick') return Object.keys(v).length; if (q.opt) return 1; if (v==='') return 0; return Array.isArray(v) ? (v.length?1:0) : 1; };

const level = () => S.earned.length;
const unlockedQ = i => i <= S.furthest;

const grant = (key, amt) => { if (S.got[key]) return 0; S.got[key] = 1; S.xp += amt; return amt; };
const terms = t => [...(t||'').matchAll(/\{([^|}]+)\|([^}]+)\}/g)].map(m=>m[2]);

/* ---------- Sound (Web Audio, optional) ---------- */
let AC = null, soundOn = (() => { try { return localStorage.getItem('aw-snd')!=='0'; } catch(e) { return true; } })();

function tone(a, type, f0, f1, t0, dur, vol) { const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur*.6);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.02); }
const snd = f => { if (!soundOn) return; const a = ctx(); if (a) f(a, a.currentTime); };
let combo = 0, comboT;
const tap = () => snd((a,t) => { clearTimeout(comboT); combo = Math.min(combo+1,6); comboT = setTimeout(()=>combo=0,1400);
  const k = 1+combo*.06+Math.random()*.04; tone(a,'triangle',420*k,1100*k,t,.15,.13); tone(a,'sine',1650*k,0,t+.06,.12,.04); });
const munch = () => snd((a,t) => { tone(a,'triangle',300,190,t,.07,.07); tone(a,'triangle',340,210,t+.1,.07,.06); });
const ting = j => snd((a,t) => { const f = 1568*Math.pow(1.06, j); tone(a,'sine',f,0,t,.2,.045); tone(a,'sine',f*2.01,0,t,.12,.012); });

/* ---------- Leaves: every answer flies a leaf to the caterpillar, which eats it and grows ---------- */
const LEAFI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 9.5 10.5 4 20.5 3.5C20.5 14 14.5 20 4 20Z" fill="#7cc46a"/><path d="M4 20C4 9.5 10.5 4 20.5 3.5C16 8 11 12 4 20Z" fill="#9ad486"/><path d="M5.5 18.5 15.5 8.5" stroke="#3f8a3a" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>';
const leafWord = n => n===1 ? 'leaf' : 'leaves';
const grow = w => (0.85 + 0.3*w/100).toFixed(2);
let xpRAF;
function tweenXP() { const el = document.getElementById('xpv'); if (!el) return; const from = +el.dataset.n||0, to = ui.shownXp, t0 = performance.now(); cancelAnimationFrame(xpRAF);
  const st = t => { const k = Math.min(1,(t-t0)/280), v = Math.round(from+(to-from)*k); el.textContent = fmt(v); el.dataset.n = v; const w = document.getElementById('xpw'); if (w) w.textContent = leafWord(v); if (k<1) xpRAF = requestAnimationFrame(st); }; xpRAF = requestAnimationFrame(st); }
function bump(id) { const p = document.getElementById(id); if (p) { p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit'); } }
function chomp() { const r = document.getElementById('rider'); if (r) { r.classList.remove('eat','hop'); void r.offsetWidth; r.classList.add('eat'); } }
function arrive(sh, k) { ui.shownXp += sh; tweenXP(); bump('xpPill'); chomp(); if (k<3) munch(); }
function target() {
  const r = document.getElementById('rider'), p = document.getElementById('xpPill');
  const el = r && r.getBoundingClientRect().width ? r : p;
  if (!el) return {x:innerWidth-90, y:24};
  const b = el.getBoundingClientRect(); return {x:b.left+b.width/2, y:b.top+b.height*(el===r ? .55 : .5)};
}
function fly(amount, x, y, n) {
  if (!amount) return;
  n = Math.min(8, n || amount);
  const lab = document.createElement('span'); lab.className = 'xpf'; lab.innerHTML = `+${amount} ${leafWord(amount)}`; lab.style.left = x+'px'; lab.style.top = y+'px';
  document.body.appendChild(lab); setTimeout(()=>lab.remove(), 1000);
  if (RM || !Element.prototype.animate) { setTimeout(()=>arrive(amount,0), 300); return; }
  for (let k=0;k<n;k++) {
    const sh = Math.floor(amount/n) + (k < amount%n ? 1 : 0);
    setTimeout(() => {
      const {x:tx, y:ty} = target();
      const c = document.createElement('i'); c.className = 'leafp'; c.innerHTML = LEAFI; document.body.appendChild(c);
      const ang = Math.random()*Math.PI*2, rad = 16+Math.random()*24, bx = x+Math.cos(ang)*rad, by = y+Math.sin(ang)*rad*.7-14;
      const cx = bx+(tx-bx)*.2+(k%2?1:-1)*(70+Math.random()*110), cy = ty+(by-ty)*.4, spin = (k%2?1:-1)*(240+Math.random()*200);
      const fr = [{transform:`translate(${x}px,${y}px) rotate(0) scale(.3)`,opacity:0,offset:0},{transform:`translate(${bx}px,${by}px) rotate(${spin*.1}deg) scale(1.1)`,opacity:1,offset:.16}];
      for (let s=1;s<=10;s++) { const t=s/10, e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, u=1-e;
        fr.push({transform:`translate(${u*u*bx+2*u*e*cx+e*e*tx}px,${u*u*by+2*u*e*cy+e*e*ty}px) rotate(${spin*(.1+.9*e)}deg) scale(${1.1-.6*e})`,opacity:s===10?.2:1,offset:.16+.84*t}); }
      let ok = false; const fin = () => { if (ok) return; ok = true; c.remove(); arrive(sh,k); };
      c.animate(fr, {duration:900+Math.random()*160, easing:'linear', fill:'forwards'}).onfinish = fin; setTimeout(fin, 1500);
    }, 160 + k*70);
  }
}
const flyFrom = (el, amt, n, mode='right') => { if (!el||!amt) return; const r = el.getBoundingClientRect();
  fly(amt, mode==='right' ? r.right-72 : r.left+r.width/2, mode==='right' ? r.top+r.height/2 : r.top+6, n); };

  else S.answers[q.i] = v;
  tap();
  const el = document.querySelector(`.qz [data-v="${v}"]`);
  if (unitsDone(q)) { const g = grant(String(q.i), XP); if (g) { flyFrom(el, g); coach(); } }

  document.querySelectorAll('.qz [data-v]').forEach(b => { const val = +b.dataset.v, cur = S.answers[q.i]; b.setAttribute('aria-checked', Array.isArray(cur) ? cur.includes(val) : cur===val); });
  refresh();
}

function setAll() {
  const q = Q[S.idx], a = {...(S.answers[q.i]||{})}; let g = 0;
  q.rows.forEach((_,r) => { a[r] = q.all; g += grant(`${q.i}:${r}`, XP); }); S.answers[q.i] = a; tap();
  save(); q.rows.forEach((_,r)=>paintRow(q, r)); refresh();
  if (g) { flyFrom(document.querySelector('[data-all]'), g); coach(); }
  mission(q);
}
function next() {
  if (busy) return;
  const q = Q[S.idx];
  if (q.k==='text') { const t = (document.getElementById('ta')||{}).value||''; S.answers[q.i] = t; if (t.trim()) flyFrom(document.getElementById('ta'), grant(String(q.i), XP), 1, 'center'); }
  if (!canNext(q)) return;
  const sec = SEC[q.si];
  if (q.i===sec.end && !secDone(q.si) && Q.filter(x=>x.si===q.si).every(x=>x.opt||complete(x))) { save(); finishSection(q.si); return; }
  if (q.i===Q.length-1) { if (S.earned.length===SEC.length) goComplete(); else { save(); openDrawer('jump'); } return; }
  S.idx = q.i+1; S.furthest = Math.max(S.furthest, S.idx); ui.focusQ = true; save(); render(); scrollTo(0,0);
}
const back = () => { if (busy || S.idx===0) return; S.idx--; ui.focusQ = true; save(); render(); scrollTo(0,0); };
const jump = i => { S.idx = i; S.screen = 'q'; ui.drawer = false; ui.jump = false; ui.focusQ = true; save(); render(); scrollTo(0,0); };
const say = m => { const el = document.getElementById('sr'); el.textContent = ''; setTimeout(() => el.textContent = m, 60); };
function setCue() {
  document.getElementById('cue').innerHTML = cueHTML(Q[S.idx]);
  document.querySelectorAll('.term').forEach(t => t.setAttribute('aria-expanded', t.dataset.term===ui.cue));
}
function exitNow() {
  if (busy) return;
  if (S.pending != null) { const si = S.pending; S.pending = null; closeReward(); if (si < SEC.length-1) { S.idx = SEC[si].end+1; S.furthest = Math.max(S.furthest, S.idx); } else { S.screen='complete'; save(); return render(); } }
  if (S.screen==='q' && Q[S.idx].k==='text') S.answers[S.idx] = (document.getElementById('ta')||{}).value||'';
  S.screen = 'saved'; ui.drawer = false; save(); render(); scrollTo(0,0);
}

document.addEventListener('click', e => {
  if (ui.jump && !e.target.closest('#jpop') && !e.target.closest('#jumpBtn') && !e.target.closest('[data-act="jump"]')) openJump(false);
  const t = e.target.closest('[data-act],[data-v],[data-g],[data-all],[data-term],[data-jump],[data-sec],[data-tab],[data-jsec]');
  if (!t) { if (e.target===scrim) openDrawer(false); return; }
  if (t.dataset.jsec) { ui.jsec = Math.max(0, Math.min(SEC.length-1, ui.jsec + +t.dataset.jsec)); renderJump(); const h = jpop.querySelector('.jc.c') || jpop.querySelector('.jx'); return; }
  if (t.dataset.v !== undefined) return setAnswer(+t.dataset.v);
  if (t.dataset.g) { const [r,j] = t.dataset.g.split(':').map(Number); return setGroup(r,j); }
  if (t.dataset.all) return setAll();
  if (t.dataset.term) { ui.cue = ui.cue===t.dataset.term ? null : t.dataset.term; return setCue(); }
  if (t.dataset.jump) return jump(+t.dataset.jump);
  if (t.dataset.sec) { const si = +t.dataset.sec; ui.openSec = ui.openSec===si ? -1 : si; return renderDrawer(); }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; return renderDrawer(); }
  const a = t.dataset.act;
  if (a==='start') { S.screen = 'q'; save(); render(); }
  if (a==='resume') { S.screen = 'q'; render(); scrollTo(0,0); }
  if (a==='restart') { S = blank(); ui = {...ui, lastIdx:null, shownXp:0, shownBadges:0}; S.screen = 'q'; save(); render(); }
  if (a==='results') goComplete();
  if (a==='next') next();
  if (a==='back') back();
  if (a==='continue') cont();
  if (a==='jump') openJump(!ui.jump);
  if (a==='jclose') { openJump(false); const b = document.getElementById('jumpBtn'); if (b && getComputedStyle(b).display!=='none') b.focus({preventScroll:true}); }
  if (a==='cdstop') stopCountdown(true);
  if (a==='menu') openDrawer('menu');
  if (a==='coll') { ui.tab = 'stages'; openDrawer('coll'); }
  if (a==='tabfacts') { ui.tab = 'facts'; openDrawer('coll'); }
  if (a==='close') openDrawer(false);
  if (a==='exit') exitNow();
  if (a==='home') { S.screen = 'intro'; render(); }
  if (a==='review') { S.idx = 0; S.screen = 'q'; save(); render(); openDrawer('jump'); }
  if (a==='text') { document.body.classList.toggle('lg-text'); try { localStorage.setItem('aw-lg', document.body.classList.contains('lg-text')?'1':''); } catch(e) {} if (ui.drawer==='menu') renderDrawer(); else t.setAttribute('aria-pressed', document.body.classList.contains('lg-text')); }
  if (a==='sound') { soundOn = !soundOn; try { localStorage.setItem('aw-snd', soundOn?'1':'0'); } catch(e) {} if (ui.drawer==='menu') renderDrawer(); else { t.setAttribute('aria-pressed',soundOn); t.innerHTML = ic(soundOn?'vol':'mute'); } if (soundOn) tap(); }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && ui.jump) return openJump(false);
  if (e.key==='Escape' && ui.drawer) return openDrawer(false);
  if (S.screen!=='q' || ui.drawer || ui.jump || busy || reward.classList.contains('open') || e.target.tagName==='TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = Q[S.idx];
  if (/^[1-9]$/.test(e.key) && q.k!=='quick') { const n = +e.key;
    if ((q.k==='freq'&&n<=5) || ((q.k==='single'||q.k==='multi') && n<=q.o.length)) setAnswer(n-1); }
  if (e.key==='Enter' && !e.target.closest('button')) { e.preventDefault(); next(); }
});

try { if (localStorage.getItem('aw-lg')) document.body.classList.add('lg-text'); } catch(e) {}
render();
</script>
</body>
